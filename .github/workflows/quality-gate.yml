name: Quality gate

# Six Sigma "Control": every change must pass tests and may not add defects.
on:
  pull_request:
  push:
    branches: [main]   # Lovable commits straight to main; check those too

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: App builds, type-checks and passes tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Type-check
        run: npx tsc -p tsconfig.app.json --noEmit
      - name: Unit tests
        run: npx vitest run
      - name: Production build
        run: npm run build

  functions:
    name: Edge function tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Shared payout, rate-limit and CORS tests
        run: deno test --allow-env --no-lock supabase/functions/_shared/

  database:
    name: Money and fraud rules (database)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Payouts, stream fraud, permissions, sigma, ledger
        run: ./supabase/tests/db/run.sh

  no-new-defects:
    name: No new defects vs. base
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: npm ci --no-audit --no-fund
      - name: Compare defect counts with the code being replaced
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="origin/${{ github.base_ref }}"
          else
            BASE="${{ github.event.before }}"
            git cat-file -e "$BASE" 2>/dev/null || BASE="HEAD~1"
          fi
          python3 scripts/quality/gate.py "$BASE"
